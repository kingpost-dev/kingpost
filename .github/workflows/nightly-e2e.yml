name: Nightly real-harness e2e

# Drives the REAL Claude Code and Codex CLIs, with their real models, against the real Kingpost server: a
# breaking edit to a consumed contract must be blocked by the hook, and allowed with KINGPOST_FORCE=1.
#
# Ubuntu only, on purpose. A real model's behavior doesn't depend on the OS, and the OS-specific plumbing (hooks,
# paths, Windows quoting) is already covered on all three OSes by the free scripted-model workflows (e2e.yml and
# install-e2e.yml). Running this on all three tripled the bill for no extra coverage: Codex alone measured about
# $0.30 per three-OS run, so a daily run would cost about $9 a month in Codex credit; Ubuntu only is about $3.
# It only runs on a schedule or by hand. Never add a pull_request trigger here: it would expose the API keys to
# fork PRs.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ matrix.harness }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        harness: [claude, codex]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/protocol
      - run: npm run build --workspace=packages/cli
      - name: Install the harness CLI
        shell: bash
        run: |
          if [ "${{ matrix.harness }}" = "claude" ]; then npm i -g @anthropic-ai/claude-code; else npm i -g @openai/codex; fi
      - name: Run the e2e scenario
        run: node scripts/e2e-real-harness.mjs ${{ matrix.harness }}
        env:
          KINGPOST_E2E_MODEL: real
          ANTHROPIC_API_KEY: ${{ matrix.harness == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ matrix.harness == 'codex' && secrets.OPENAI_API_KEY || '' }}
