name: Install e2e (published package)

# Everything else tests the repo's own build. This installs what a user actually gets from `npm i -g kingpost` on a
# clean runner and walks the first ten minutes: init, join, doctor, update, then the real Claude Code / Codex
# sessions (scripted model, so free) running through that install's hook and MCP paths. It runs after each publish,
# nightly (to catch the registry, Node, or a harness release changing under us), and on demand.
on:
  workflow_run:
    workflows: ["Publish to npm"]
    types: [completed]
  schedule:
    - cron: "47 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.harness }} on ${{ matrix.os }}
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        harness: [claude, codex]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Work out which version must be installed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            EXPECT=$(node -p "require('./packages/cli/package.json').version")
            # The registry can lag a few minutes behind the publish job finishing.
            for i in $(seq 1 40); do
              [ "$(npm view kingpost version)" = "$EXPECT" ] && break
              echo "waiting for kingpost@$EXPECT to appear on npm (now $(npm view kingpost version))"; sleep 15
            done
          else
            EXPECT=$(npm view kingpost version)
          fi
          echo "KINGPOST_E2E_EXPECT_VERSION=$EXPECT" >> "$GITHUB_ENV"
          echo "expecting kingpost@$EXPECT"
      - name: Install kingpost and both harnesses, as a user would
        shell: bash
        run: npm i -g "kingpost@$KINGPOST_E2E_EXPECT_VERSION" @anthropic-ai/claude-code @openai/codex
      - name: First ten minutes (install, init, join, doctor, update)
        run: node scripts/e2e-install.mjs
        env:
          KINGPOST_E2E_CLI: installed
      - name: Break-and-override scenario through the installed package
        run: node scripts/e2e-real-harness.mjs ${{ matrix.harness }}
        env:
          KINGPOST_E2E_CLI: installed
          KINGPOST_E2E_MODEL: fake
      - name: Two-agent team scenario through the installed package
        run: node scripts/e2e-team.mjs ${{ matrix.harness }}
        env:
          KINGPOST_E2E_CLI: installed
          KINGPOST_E2E_MODEL: fake
      - name: Shell-write scenario through the installed package
        run: node scripts/e2e-shell.mjs ${{ matrix.harness }}
        env:
          KINGPOST_E2E_CLI: installed
          KINGPOST_E2E_MODEL: fake
