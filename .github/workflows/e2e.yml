name: E2E (real harnesses, scripted model)

# Drives the REAL Claude Code and Codex CLIs against the real Kingpost server on every OS, with the model
# replaced by a local scripted stand-in (scripts/fake-model). Kingpost's hooks, blocking and plumbing all run
# for real inside the real harness; only the model's choices are scripted, so this is free, deterministic and
# needs no secrets, which is why it is safe to run on every push and on pull requests from forks.
# The real-model run lives in nightly-e2e.yml.
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ matrix.harness }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        harness: [claude, codex]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/protocol
      - run: npm run build --workspace=packages/cli
      - name: Install the harness CLI
        shell: bash
        run: |
          if [ "${{ matrix.harness }}" = "claude" ]; then npm i -g @anthropic-ai/claude-code; else npm i -g @openai/codex; fi
      - name: Run the e2e scenario (scripted model)
        run: node scripts/e2e-real-harness.mjs ${{ matrix.harness }}
        env:
          KINGPOST_E2E_MODEL: fake
      - name: Run the team scenario (two agents, scripted model)
        run: node scripts/e2e-team.mjs ${{ matrix.harness }}
        env:
          KINGPOST_E2E_MODEL: fake
